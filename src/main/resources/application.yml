server:
  port: 0

spring:
  application:
    name: quartz-job-scheduler
  profiles:
#    Includ the profile json-logs to print logs in JSON format
#    active: json-logs,dev
    active: dev

jobs:
  configs:
    xmlPath: classpath:CronJobSchedulerConfigs.xml
# For external file
# xmlPath: file:/opt/configs/beans-config.xml


quartz:
  scheduler:
    threadName: QuartzScheduler
    instanceName: ${spring.application.name}
    instanceId: AUTO
  threadPool:
    threadCount: 10
    class: "org.quartz.simpl.SimpleThreadPool"
  jobStore:
#    class: "org.quartz.impl.jdbcjobstore.JobStoreTX"
    class: " org.springframework.scheduling.quartz.LocalDataSourceJobStore"
    driverDelegateClass: "org.quartz.impl.jdbcjobstore.StdJDBCDelegate"
    tablePrefix: QRTZ_SCHEDULER.QRTZ_
    isClustered: true
  datasource:
    url: jdbc:db2://127.0.0.1:50000/TESTDB
    username: db2inst1
    password: password


